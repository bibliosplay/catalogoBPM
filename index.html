<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buscador · Biblioteca Nacional</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --paper: #EDE6D6;
    --paper-raised: #F5F0E4;
    --ink: #1C2430;
    --ink-soft: #5B5747;
    --green: #33513F;
    --green-soft: #E4EBE3;
    --stamp-red: #A23B2E;
    --stamp-red-soft: #F3E1DC;
    --line: #D8CEB6;
    --radius: 14px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .frame{
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    padding-bottom: 40px;
  }
  header{
    padding: 22px 18px 16px;
    border-bottom: 1px solid var(--line);
    position: sticky;
    top: 0;
    background: var(--paper);
    z-index: 5;
  }
  .eyebrow{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--green);
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .eyebrow::before{ content:""; width:7px; height:7px; border-radius:50%; background: var(--green); }
  h1{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 24px;
    margin: 0 0 14px 0;
    letter-spacing: -0.01em;
  }
  .search-box{
    position: relative;
    background: var(--paper-raised);
    border: 1.5px solid var(--ink);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex; align-items: center; gap: 10px;
  }
  .search-box svg{ flex-shrink:0; opacity:0.7; }
  .search-box input{
    border: none; background: transparent; outline: none;
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 16px; color: var(--ink); width: 100%;
  }
  .search-box input::placeholder{ color: var(--ink-soft); }

  .result-meta{
    padding: 14px 18px 4px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }
  .result-meta b{ color: var(--ink); }

  .results{
    padding: 8px 18px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card{
    position: relative;
    background: var(--paper-raised);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 16px 14px 20px;
    overflow: hidden;
  }
  .card::before{
    content: "";
    position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
    background: repeating-linear-gradient(to bottom, var(--line) 0px, var(--line) 5px, transparent 5px, transparent 10px);
  }
  .card-title{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 16.5px;
    line-height: 1.3;
    margin: 0 0 4px 0;
  }
  .card-author{
    font-size: 13.5px;
    color: var(--ink-soft);
    margin: 0 0 12px 0;
  }
  .card-bottom{
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
  }
  .card-id{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
  }
  .card-link{
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--paper-raised);
    background: var(--stamp-red);
    padding: 7px 13px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .card-link:active{ transform: scale(0.97); }

  .empty, .loading, .error, .prompt{
    text-align: center;
    padding: 60px 24px;
    color: var(--ink-soft);
    font-size: 14.5px;
  }
  .error{ color: var(--stamp-red); }
  .error strong{ display:block; margin-bottom: 6px; font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.06em; text-transform:uppercase; }

  mark{
    background: none;
    color: var(--green);
    font-weight: 600;
  }

  .load-more{
    display: block;
    width: calc(100% - 36px);
    margin: 4px 18px 0;
    padding: 12px;
    border-radius: 10px;
    border: 1.5px dashed var(--line);
    background: transparent;
    color: var(--ink-soft);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .load-more:active{ transform: scale(0.98); }

  footer{
    text-align: center;
    padding: 22px 18px 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div class="frame">
  <header>
    <div class="eyebrow">Sistema de Bibliotecas Públicas</div>
    <h1>Buscar en el catálogo</h1>
    <div class="search-box">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="searchInput" placeholder="Título, autor o ID…" autofocus>
    </div>
  </header>

  <div class="result-meta" id="resultMeta"></div>
  <div class="results" id="results"></div>
  <button class="load-more" id="loadMore" style="display:none;">Mostrar más resultados</button>
  <footer id="footerNote">Datos cargados desde datos.csv</footer>
</div>

<script>
  // -------------------- CONFIGURACIÓN --------------------
  const CSV_URL = 'datos.csv';   // mismo archivo que usa buscador_bpm.html
  const PAGE_SIZE = 40;          // cuántas tarjetas se muestran a la vez
  // -------------------------------------------------------

  let allData = [];
  let currentFiltered = [];
  let shown = 0;

  const resultsEl = document.getElementById('results');
  const metaEl = document.getElementById('resultMeta');
  const input = document.getElementById('searchInput');
  const loadMoreBtn = document.getElementById('loadMore');
  const footerNote = document.getElementById('footerNote');

  function buildLink(id){
    return `http://www.bncatalogo.cl/F/?func=item-global&doc_library=SBP01&doc_number=${id}&sub_library=7336`;
  }

  function escapeHtml(text){
    const div = document.createElement('div');
    div.textContent = text || '';
    return div.innerHTML;
  }

  function highlight(text, query){
    const safe = escapeHtml(text);
    if(!query) return safe;
    const idx = safe.toLowerCase().indexOf(query.toLowerCase());
    if(idx === -1) return safe;
    return safe.slice(0, idx) + '<mark>' + safe.slice(idx, idx + query.length) + '</mark>' + safe.slice(idx + query.length);
  }

  async function loadCSV(){
    resultsEl.innerHTML = '<div class="loading">Cargando catálogo…</div>';
    try{
      const response = await fetch(CSV_URL);
      if(!response.ok) throw new Error('No se pudo cargar el archivo CSV');
      const csvText = await response.text();

      // Parseo robusto con PapaParse: respeta comas dentro de comillas
      // (importante porque los autores vienen como "Apellido, Nombre")
      const parsed = Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        transformHeader: h => h.trim().toLowerCase()
      });

      if(parsed.errors && parsed.errors.length){
        console.warn('Avisos al parsear CSV:', parsed.errors);
      }

      const rows = parsed.data;
      if(!rows.length || !('autor' in rows[0]) || !('titulo' in rows[0]) || !('id' in rows[0])){
        throw new Error('El CSV debe tener columnas: autor, titulo, id');
      }

      allData = rows
        .filter(r => r.autor && r.titulo && r.id)
        .map(r => ({ autor: r.autor.trim(), titulo: r.titulo.trim(), id: r.id.trim() }));

      footerNote.textContent = `${allData.length.toLocaleString('es-CL')} registros cargados desde datos.csv`;
      showPrompt();
    }catch(error){
      resultsEl.innerHTML = `<div class="error"><strong>No se pudo cargar</strong>${escapeHtml(error.message)}. Verifica que <strong>datos.csv</strong> esté en la misma carpeta y que la página se abra desde un servidor (no como archivo local).</div>`;
      metaEl.textContent = '';
      console.error(error);
    }
  }

  function showPrompt(){
    resultsEl.innerHTML = '<div class="prompt">Escribe un título, autor o ID para empezar a buscar.</div>';
    metaEl.innerHTML = '';
    loadMoreBtn.style.display = 'none';
  }

  function renderPage(query){
    const toShow = currentFiltered.slice(0, shown);

    if(toShow.length === 0){
      resultsEl.innerHTML = '<div class="empty">No se encontraron resultados. Prueba con otro título, autor o ID.</div>';
      loadMoreBtn.style.display = 'none';
      return;
    }

    resultsEl.innerHTML = toShow.map(item => `
      <div class="card">
        <p class="card-title">${highlight(item.titulo, query)}</p>
        <p class="card-author">${highlight(item.autor, query)}</p>
        <div class="card-bottom">
          <span class="card-id">ID ${escapeHtml(item.id)}</span>
          <a class="card-link" href="${buildLink(item.id)}" target="_blank" rel="noopener">Ver en catálogo →</a>
        </div>
      </div>
    `).join('');

    loadMoreBtn.style.display = shown < currentFiltered.length ? 'block' : 'none';
  }

  function runSearch(query){
    if(query === ''){
      showPrompt();
      return;
    }
    const q = query.toLowerCase();
    currentFiltered = allData.filter(item =>
      item.autor.toLowerCase().includes(q) ||
      item.titulo.toLowerCase().includes(q) ||
      item.id.includes(query)
    );
    shown = Math.min(PAGE_SIZE, currentFiltered.length);
    metaEl.innerHTML = `<b>${currentFiltered.length.toLocaleString('es-CL')}</b> ${currentFiltered.length === 1 ? 'resultado' : 'resultados'} encontrados`;
    renderPage(query);
  }

  let debounceTimer;
  input.addEventListener('input', (e) => {
    clearTimeout(debounceTimer);
    const query = e.target.value.trim();
    debounceTimer = setTimeout(() => runSearch(query), 180);
  });

  loadMoreBtn.addEventListener('click', () => {
    shown = Math.min(shown + PAGE_SIZE, currentFiltered.length);
    renderPage(input.value.trim());
  });

  loadCSV();
</script>

</body>
</html>
